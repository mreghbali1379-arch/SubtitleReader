name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download OCR language data (Persian and English)
        run: |
          mkdir -p app/src/main/assets/tessdata
          for l in fas eng; do
            curl -L -f -o app/src/main/assets/tessdata/$l.traineddata \
              https://github.com/tesseract-ocr/tessdata_fast/raw/main/$l.traineddata
          done


      - name: Download more accurate OCR language data (best)
        run: |
          mkdir -p app/src/main/assets/tessdata_best
          for l in fas eng; do
            curl -L -f -o app/src/main/assets/tessdata_best/$l.traineddata \
              https://github.com/tesseract-ocr/tessdata_best/raw/main/$l.traineddata
          done

      - name: Download PaddleOCR Persian model (offline engine)
        run: |
          D=app/src/main/assets/paddle
          H=https://huggingface.co/monkt/paddleocr-onnx
          B=$H/resolve/main/languages/arabic
          mkdir -p $D
          for f in rec.onnx dict.txt; do
            if [ ! -s $D/$f ]; then
              curl -L -f -o $D/$f $B/$f || true
            fi
          done
          find $D -type f -size 0 -delete
          ls -la $D

      - name: Build debug APK
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace > build.log 2>&1
          code=$?
          grep -n -E "^e: |What went wrong|Execution failed" -A6 build.log | head -60
          tail -n 5 build.log
          exit $code

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleReader-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish the APK on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SubtitleReader (latest build)
          files: app/build/outputs/apk/debug/app-debug.apk
