name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download OCR language data (Persian and English)
        run: |
          mkdir -p app/src/main/assets/tessdata
          for l in fas eng; do
            curl -L -f -o app/src/main/assets/tessdata/$l.traineddata \
              https://github.com/tesseract-ocr/tessdata_fast/raw/main/$l.traineddata
          done


      - name: Download more accurate OCR language data (best)
        run: |
          mkdir -p app/src/main/assets/tessdata_best
          for l in fas eng; do
            curl -L -f -o app/src/main/assets/tessdata_best/$l.traineddata \
              https://github.com/tesseract-ocr/tessdata_best/raw/main/$l.traineddata
          done

      - name: Download PaddleOCR Persian model (offline engine)
        run: |
          mkdir -p app/src/main/assets/paddle
          for f in rec.onnx dict.txt; do
            if [ -s app/src/main/assets/paddle/$f ]; then
              echo "$f is already in the project, not downloading it"
            else
              curl -L -f -o app/src/main/assets/paddle/$f \
                https://huggingface.co/monkt/paddleocr-onnx/resolve/main/languages/arabic/$f \
                || rm -f app/src/main/assets/paddle/$f
            fi
          done
          ls -la app/src/main/assets/paddle

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleReader-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish the APK on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SubtitleReader (latest build)
          files: app/build/outputs/apk/debug/app-debug.apk
