name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the project if it was uploaded as a zip
        run: |
          Z=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -n "$Z" ]; then
            mkdir -p unpacked
            unzip -q -o "$Z" -d unpacked
            echo "Unpacked $Z"
          fi

      - name: Find the project folder
        run: |
          if [ -f settings.gradle.kts ]; then
            F=./settings.gradle.kts
          else
            F=$(find . -name settings.gradle.kts | head -n 1)
          fi
          if [ -z "$F" ]; then
            echo "settings.gradle.kts not found. Files in the repo:"
            find . -maxdepth 3 -not -path "./.git/*" | head -n 60 > files.txt
            cat files.txt
            echo "::error::settings.gradle.kts not found. Repo files:"
            head -n 15 files.txt | while read -r L; do echo "::error::$L"; done
            exit 1
          fi
          P=$(dirname "$F")
          echo "PROJ=$P" >> $GITHUB_ENV
          echo "Project folder: $P"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download OCR language data (Persian and English)
        run: |
          cd $PROJ
          mkdir -p app/src/main/assets/tessdata
          for l in fas eng; do
            curl -L -f -o app/src/main/assets/tessdata/$l.traineddata \
              https://github.com/tesseract-ocr/tessdata_fast/raw/main/$l.traineddata
          done

      - name: Download more accurate OCR language data (best)
        run: |
          cd $PROJ
          mkdir -p app/src/main/assets/tessdata_best
          for l in fas eng; do
            curl -L -f -o app/src/main/assets/tessdata_best/$l.traineddata \
              https://github.com/tesseract-ocr/tessdata_best/raw/main/$l.traineddata
          done

      - name: Download PaddleOCR Persian model (offline engine)
        run: |
          cd $PROJ
          D=app/src/main/assets/paddle
          H=https://huggingface.co/monkt/paddleocr-onnx
          B=$H/resolve/main/languages/arabic
          mkdir -p $D
          for f in rec.onnx dict.txt; do
            if [ ! -s $D/$f ]; then
              curl -L -f -o $D/$f $B/$f || true
            fi
          done
          find $D -type f -size 0 -delete
          ls -la $D

      - name: Build debug APK
        run: |
          cd $PROJ
          set +e
          gradle :app:assembleDebug --stacktrace > build.log 2>&1
          code=$?
          grep -E "^e: |What went wrong" -A3 build.log | head -n 40 > err.txt
          head -n 12 err.txt | while read -r L; do echo "::error::$L"; done
          cat err.txt
          tail -n 5 build.log
          exit $code

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleReader-debug-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish the APK on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SubtitleReader (latest build)
          files: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
